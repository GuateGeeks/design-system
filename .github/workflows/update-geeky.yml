name: Update Geeky

# A GuateGeeks/geeky-animation release becomes a pull request here: its release workflow sends
# `geeky-release`; the weekly run catches releases sent without that notification.
on:
  repository_dispatch:
    types: [geeky-release]
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Geeky version (X.Y.Z) or latest
        default: latest

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-geeky
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pin the release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
        run: node scripts/update-geeky.mjs "$REQUESTED"
      - if: steps.bump.outputs.changed == 'true'
        run: npm run build
      - if: steps.bump.outputs.changed == 'true'
        run: npm test
      - if: steps.bump.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/lab
      - name: End-to-end and visual suites (baselines updated if Geeky changed visibly)
        id: e2e
        if: steps.bump.outputs.changed == 'true'
        run: |
          if npm run e2e; then
            echo "snapshots=unchanged" >> "$GITHUB_OUTPUT"
          else
            npm run e2e -- --update-snapshots
            echo "snapshots=updated" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the pull request body
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          SNAPSHOTS: ${{ steps.e2e.outputs.snapshots }}
        run: |
          {
            echo "Updates \`@guategeeks/mascot\` to [GuateGeeks/geeky-animation v$VERSION](https://github.com/GuateGeeks/geeky-animation/releases/tag/v$VERSION)."
            echo
            echo "## Release notes"
            echo
            gh release view "v$VERSION" --repo GuateGeeks/geeky-animation --json body -q .body
            echo
            echo "## Checks run by this workflow"
            echo
            echo "- [x] \`npm run build\`, \`npm test\`"
            if [ "$SNAPSHOTS" = "updated" ]; then
              echo "- [ ] ⚠️ Visual baselines were updated: review the changed images in this pull request"
            else
              echo "- [x] \`npm run e2e\`: visual baselines unchanged"
            fi
            echo
            echo "Generated by .github/workflows/update-geeky.yml."
          } > "$RUNNER_TEMP/geeky-pr.md"
      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GEEKY_UPDATE_TOKEN || github.token }}
          branch: deps/geeky-v${{ steps.bump.outputs.version }}
          commit-message: 'chore(mascot): update Geeky to v${{ steps.bump.outputs.version }}'
          title: 'chore(mascot): update Geeky to v${{ steps.bump.outputs.version }}'
          body-path: ${{ runner.temp }}/geeky-pr.md
          labels: dependencies, geeky
          delete-branch: true
